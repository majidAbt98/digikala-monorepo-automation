version: "3.8"

# Digikala Automation Platform — Local Development
# Built on Activepieces core (apps/activepieces/)
# Usage: docker compose up -d

services:
  # Infrastructure services
  postgres:
    image: postgres:16-alpine
    container_name: digikala-automation-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: digikala_automation
      POSTGRES_USER: digikala
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:-digikala_dev_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digikala"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: digikala-automation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Activepieces core (built from apps/activepieces/)
  app:
    build:
      context: ./apps/activepieces
      dockerfile: Dockerfile
    container_name: digikala-automation-app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Server
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_SANDBOX_RUN_MODE: THREADS
      AP_ENVIRONMENT: prod

      # Database
      AP_POSTGRES_DATABASE: digikala_automation
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: digikala
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:-digikala_dev_2026}

      # Redis
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: "6379"

      # Security (change for production!)
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:-change-me-in-production-32chars!}
      AP_JWT_SECRET: ${AP_JWT_SECRET:-change-me-in-production-jwt-sec}

      # Frontend URL
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-http://localhost:8080}

      # Telemetry disabled
      AP_TELEMETRY_ENABLED: "false"

      # Execution
      AP_FLOW_TIMEOUT_SECONDS: "600"
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: "5"

volumes:
  postgres_data:
  redis_data:
